[package]
name = "phanes"
version = "1.2.0"
description = "Write and read markdown"
authors = ["Nayed Saïd Ali"]
edition = "2021"
license = "MIT"

[lib]
name = "phanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phanes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["protocol-asset"] }
# File dialogs go through the XDG desktop portal: on GNOME that is the Files
# app's own chooser, running outside Phanes (the default, gtk3, builds GTK3's
# chooser inside the app, which is slow the first time).
tauri-plugin-dialog = { version = "2.8", default-features = false, features = ["xdg-portal"] }
tauri-plugin-opener = "2.7"
tauri-plugin-clipboard-manager = "2.5"
trash = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
env_logger = { version = "0.11.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
dbus = "0.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
