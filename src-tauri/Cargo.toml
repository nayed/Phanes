[package]
name = "phanes"
version = "0.1.0"
description = "Write and read markdown"
authors = ["Nayed Saïd Ali"]
edition = "2021"
license = "MIT"

[lib]
name = "phanes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "phanes"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
strip = true
