# Build the .deb, .rpm and AppImage for a version tag and attach them to a
# draft GitHub release, which you review and publish by hand.
#
# Built on Ubuntu 24.04 on purpose: packages only run on systems with the
# same glibc or newer, so the build machine must be the oldest system to
# support. 24.04 (glibc 2.39) covers Debian 13, Ubuntu 24.04 and newer,
# current Fedora and openSUSE Tumbleweed. Don't move it to a newer release
# without checking: Ubuntu 26.04's glibc is newer than Debian 13's.
#
# Push a tag (git tag -a v1.2.0 -m "Phanes 1.2.0" && git push origin v1.2.0),
# or start it by hand from the Actions tab to rebuild an existing tag. If a
# release for the tag already exists, it is left alone and the packages are
# only attached to the run, to download from there.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for example v1.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Check the tag matches the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match version $version in package.json"
            exit 1
          fi

      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file xdg-utils

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build

      - name: Collect the packages
        run: |
          mkdir packages
          cp src-tauri/target/release/bundle/deb/*.deb \
             src-tauri/target/release/bundle/rpm/*.rpm \
             src-tauri/target/release/bundle/appimage/*.AppImage packages/
          ls -l packages
          echo "Newest glibc the binary needs:"
          objdump -T src-tauri/target/release/phanes | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -1

      - uses: actions/upload-artifact@v7
        with:
          name: phanes-${{ env.TAG }}
          path: packages/

      - name: Draft the GitHub release
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::A release for $TAG already exists, so it was left unchanged. The packages are attached to this run."
            exit 0
          fi
          gh release create "$TAG" packages/* --draft --verify-tag \
            --title "Phanes ${TAG#v}" --generate-notes
